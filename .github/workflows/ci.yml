name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend
  # ─────────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/requirements*.txt

      - name: Install dependencies
        working-directory: apps/backend
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: ruff lint
        working-directory: apps/backend
        run: ruff check .

      - name: ruff format check
        working-directory: apps/backend
        run: ruff format --check .

  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fts_user
          POSTGRES_PASSWORD: fts_test_password
          POSTGRES_DB: fts_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fts_user -d fts_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://fts_user:fts_test_password@localhost:5433/fts_test_db
      DATABASE_URL_SYNC: postgresql://fts_user:fts_test_password@localhost:5433/fts_test_db
      POSTGRES_PASSWORD: fts_test_password
      REDIS_URL: redis://localhost:6380/0
      REDIS_PASSWORD: ""
      CELERY_BROKER_URL: redis://localhost:6380/0
      CELERY_RESULT_BACKEND: redis://localhost:6380/0
      SECRET_KEY: ci-secret-key-minimum-32-characters-long
      MINIO_ROOT_PASSWORD: ci-minio-password
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/requirements*.txt

      - name: Install dependencies
        working-directory: apps/backend
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        working-directory: apps/backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: apps/backend
        run: pytest -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/backend/coverage.xml
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: ESLint
        working-directory: apps/frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: apps/frontend
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Training Engine
  # ─────────────────────────────────────────────────────────────────────────────
  training-engine-lint:
    name: Training Engine — Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: training_engine/requirements.txt

      - name: Install PyTorch (CPU wheels for CI)
        working-directory: training_engine
        run: |
          uv pip install --system torch==2.3.0 torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        working-directory: training_engine
        run: uv pip install --system -r requirements.txt

      - name: ruff lint
        working-directory: training_engine
        run: ruff check .

      - name: ruff format check
        working-directory: training_engine
        run: ruff format --check .

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker build smoke-test (no push)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Check
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend (development)
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          target: development
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend (development)
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          target: development
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build training engine (development)
        uses: docker/build-push-action@v5
        with:
          context: training_engine
          target: development
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
