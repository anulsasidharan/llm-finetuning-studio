version: "3.9"

name: llm-finetuning-studio

networks:
  fts_network:
    driver: bridge
    name: fts_network

volumes:
  fts_postgres_data:
    name: fts_postgres_data
  fts_redis_data:
    name: fts_redis_data
  fts_minio_data:
    name: fts_minio_data
  fts_hf_cache:
    name: fts_hf_cache

services:

  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: fts_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"             # Host 5433 — avoids conflict with any other Postgres
    volumes:
      - fts_postgres_data:/var/lib/postgresql/data
    networks:
      - fts_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fts_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6380:6379"             # Host 6380 — avoids conflict with any other Redis
    volumes:
      - fts_redis_data:/data
    networks:
      - fts_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible object storage — dev) ───────────────
  minio:
    image: minio/minio:latest
    container_name: fts_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"             # S3 API
      - "9001:9001"             # MinIO web console
    volumes:
      - fts_minio_data:/data
    networks:
      - fts_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO bucket initializer (one-shot) ──────────────────────
  minio_init:
    image: minio/mc:latest
    container_name: fts_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - fts_network
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set fts http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing fts/${BUCKET_DATASETS};
      mc mb --ignore-existing fts/${BUCKET_MODELS};
      mc mb --ignore-existing fts/${BUCKET_CHECKPOINTS};
      mc mb --ignore-existing fts/${BUCKET_EXPORTS};
      echo 'MinIO buckets initialized.';
      exit 0;
      "

  # ─── Backend API (FastAPI) ────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: fts_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
      - fts_hf_cache:/app/.cache/huggingface
    networks:
      - fts_network
    command: sh /app/start.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Celery Worker ────────────────────────────────────────────
  celery_worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: fts_celery_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
      - ./training_engine:/training_engine
      - fts_hf_cache:/app/.cache/huggingface
    networks:
      - fts_network
    command: >
      celery -A core.celery_app worker
      --loglevel=info
      --queues=training,export,default
      --concurrency=2

  # ─── Celery Beat (scheduled tasks — GPU pricing refresh) ──────
  celery_beat:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: fts_celery_beat
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./apps/backend:/app
    networks:
      - fts_network
    command: celery -A core.celery_app beat --loglevel=info

  # ─── Flower (Celery monitor — dev only) ───────────────────────
  flower:
    image: mher/flower:2.0
    container_name: fts_flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      FLOWER_BASIC_AUTH: admin:admin
    depends_on:
      - redis
    networks:
      - fts_network

  # ─── Frontend (Next.js) ───────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: development
    container_name: fts_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - fts_network
    command: npm run dev
