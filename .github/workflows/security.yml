name: Security Scan

on:
  push:
    branches: [main, develop]
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Trivy — scan Docker images for CVEs
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-backend:
    name: Trivy — Backend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (production)
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          target: production
          push: false
          load: true
          tags: fts-backend:scan
          cache-from: type=gha

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fts-backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload backend SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  trivy-frontend:
    name: Trivy — Frontend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image (production)
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          target: production
          push: false
          load: true
          tags: fts-frontend:scan
          cache-from: type=gha
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_WS_URL=ws://localhost:8000

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fts-frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload frontend SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # ─────────────────────────────────────────────────────────────────────────────
  # Trivy — scan the repo filesystem for secrets and misconfigured IaC
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-fs:
    name: Trivy — Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload filesystem SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
