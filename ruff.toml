line-length = 100
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # function calls in default args (FastAPI Depends pattern)
]

[lint.per-file-ignores]
"migrations/*" = ["E402", "F401"]
"tests/*" = ["S101"]
"scripts/*" = ["T201"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
