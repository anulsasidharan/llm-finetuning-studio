name: CD — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run the deploy step (requires DEPLOY_* secrets)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  # Images: ghcr.io/<owner>/llm-finetuning-studio-{backend,frontend}
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/llm-finetuning-studio-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/llm-finetuning-studio-frontend

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build production images and push to GitHub Container Registry
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.version }}
      frontend-tag: ${{ steps.meta-frontend.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Metadata — backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push — backend
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Metadata — frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push — frontend
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          target: production
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy to production server via SSH
  #
  # Requires the following repository secrets:
  #   DEPLOY_HOST      — IP or hostname of the production server
  #   DEPLOY_USER      — SSH user (e.g. ubuntu)
  #   DEPLOY_SSH_KEY   — private key whose public key is in authorized_keys
  #   DEPLOY_PATH      — path to docker-compose.prod.yml on the server
  #                      (e.g. /opt/llm-finetuning-studio)
  #
  # Set secrets under:
  #   GitHub → repo Settings → Secrets and variables → Actions
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    # Skip unless secrets are wired or the caller explicitly requested deploy
    if: >
      (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)

    steps:
      - uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Pull new images
            docker compose -f docker-compose.prod.yml pull

            # Rolling restart (zero-downtime for stateless services)
            docker compose -f docker-compose.prod.yml up -d \
              --remove-orphans \
              --no-build

            # Remove dangling images to reclaim disk space
            docker image prune -f

            echo "Deploy complete — $(date -u)"
