# Nginx reverse proxy — LLM Fine-Tuning Studio (production)
#
# Routes:
#   /api/*        → backend:8000  (FastAPI REST)
#   /ws/*         → backend:8000  (WebSocket — training live feed)
#   /health       → backend:8000  (health check passthrough)
#   /docs, /redoc → backend:8000  (OpenAPI — remove in hardened deployments)
#   /*            → frontend:3000 (Next.js standalone)
#
# TLS: mount your cert/key at /etc/nginx/certs/fullchain.pem and
#      /etc/nginx/certs/privkey.pem and uncomment the HTTPS server block.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Datasets can be up to 500 MB
    client_max_body_size 512m;

    gzip on;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ─── HTTP ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options        "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options "nosniff"                       always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ── WebSocket — training live metrics ──────────────────
        location /ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── FastAPI REST ────────────────────────────────────────
        location /api/ {
            proxy_pass             http://backend;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     300s;
            proxy_connect_timeout  10s;
            proxy_send_timeout     300s;
        }

        # ── Health check ────────────────────────────────────────
        location /health {
            proxy_pass       http://backend;
            proxy_set_header Host $host;
            access_log       off;
        }

        # ── OpenAPI docs (consider removing in hardened deploys) ─
        location /docs {
            proxy_pass       http://backend;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass       http://backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass       http://backend;
            proxy_set_header Host $host;
        }

        # ── Next.js static assets (long cache) ─────────────────
        location /_next/static/ {
            proxy_pass   http://frontend;
            expires      1y;
            add_header   Cache-Control "public, immutable";
            access_log   off;
        }

        # ── Frontend — everything else ──────────────────────────
        location / {
            proxy_pass             http://frontend;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     60s;
        }
    }

    # ─── HTTPS (uncomment and configure when certs are mounted) ──
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # Same location blocks as the HTTP server above
    #     # ...
    # }
    #
    # Redirect HTTP → HTTPS
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }
}
